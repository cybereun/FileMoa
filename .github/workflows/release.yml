name: Release FileMoa

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Rust 1.98.x produces a Tauri NSIS-patched Windows executable that
      # exits with STATUS_STACK_OVERFLOW on startup. Keep the release toolchain
      # pinned until the Tauri patcher supports that toolchain reliably.
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FileMoa ${{ github.ref_name }}"
          releaseBody: "FileMoa automatic update release."
          releaseDraft: false
          prerelease: false
