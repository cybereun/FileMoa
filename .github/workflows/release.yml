name: Release FileMoa

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Rust 1.98.x produces a Tauri NSIS-patched Windows executable that
      # exits with STATUS_STACK_OVERFLOW on startup. Keep the release toolchain
      # pinned until the Tauri patcher supports that toolchain reliably.
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: npm ci
      - name: Verify synchronized app version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $versions = @($packageVersion, $tauriVersion, $cargoVersion) | Select-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match the app version v$packageVersion"
          }
          Write-Host "Building FileMoa v$packageVersion"
      - name: Run frontend tests
        run: npm test -- --run
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The action substitutes __VERSION__ from tauri.conf.json. This
          # keeps branch pushes idempotent and creates a new release whenever
          # the app version is deliberately bumped in the three manifests.
          tagName: v__VERSION__
          releaseName: "FileMoa v__VERSION__"
          releaseBody: "FileMoa automatic update release."
          releaseDraft: false
          prerelease: false
      - name: Build portable executable
        run: npm run tauri build -- --no-bundle
      - name: Prepare portable release asset
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $source = "src-tauri/target/release/filemoa.exe"
          $target = "src-tauri/target/release/FileMoa_${version}_portable.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Portable executable was not produced: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Force
          Write-Host "Prepared $target"
      - name: Upload portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $asset = "src-tauri/target/release/FileMoa_${version}_portable.exe"
          gh release upload "v$version" $asset --clobber
