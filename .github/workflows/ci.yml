name: CI

# Every branch and pull request gets the full check. Releases are a separate
# workflow (release.yml) that only runs on main and tags.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pinned like the release build: newer toolchains break the Tauri NSIS patcher.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Verify synchronized app version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (@($packageVersion, $tauriVersion, $cargoVersion | Select-Object -Unique).Count -ne 1) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }
      - name: Frontend tests
        run: npm test -- --run
      - name: Frontend type check and build
        run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
