[package]
name = "filemoa"
version = "0.1.3"
description = "Safe local file organization for Windows"
authors = ["FileMoa"]
edition = "2021"

[lib]
name = "filemoa_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2.4.1"
tauri-plugin-store = "2.4.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
