[package]
name = "filemoa"
version = "0.1.5"
description = "Safe local file organization for Windows"
authors = ["FileMoa"]
edition = "2021"

[lib]
name = "filemoa_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2.4.1"
tauri-plugin-store = "2.4.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false
